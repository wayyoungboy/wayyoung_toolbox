<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="在飞牛 NAS 中统一管理备份、文件检查、影片采集、音乐转换与 HA500 硬件工具。" />
    <title>wayyoung的飞牛工具箱</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">W</span>
          <div>
            <strong>wayyoung</strong>
            <span>飞牛工具箱</span>
          </div>
        </div>

        <div class="nav-label">模块</div>
        <nav class="module-tabs" id="module-tabs" role="tablist" aria-label="工具箱模块">
          <div class="nav-loading">正在读取模块…</div>
        </nav>

        <div class="sidebar-footer">
          <div class="module-total">
            <span class="pulse" aria-hidden="true"></span>
            <span id="running-count">—</span>
          </div>
          <button type="button" class="icon-button" id="refresh" aria-label="刷新模块状态" title="刷新模块状态">↻</button>
        </div>
      </aside>

      <main class="workspace">
        <header class="module-header" id="module-header" hidden>
          <div class="module-heading">
            <div class="module-icon" id="module-icon" aria-hidden="true"></div>
            <div>
              <div class="heading-line">
                <h1 id="module-name"></h1>
                <span class="version" id="module-version"></span>
              </div>
              <p id="module-description"></p>
            </div>
          </div>
          <div class="module-controls">
            <div class="status-pill" id="module-status"><span class="status-dot"></span><span>读取中</span></div>
            <span class="toggle-label" id="toggle-label">启用模块</span>
            <label class="switch" title="独立启停当前模块">
              <input type="checkbox" id="module-toggle" aria-labelledby="module-name toggle-label" />
              <span class="slider"></span>
            </label>
          </div>
        </header>

        <section class="notice" id="notice" hidden aria-live="polite"></section>
        <section class="module-content" id="module-content" role="tabpanel" tabindex="0" aria-live="polite">
          <div class="initial-loading"><span class="spinner"></span><span>正在连接工具箱…</span></div>
        </section>
      </main>
    </div>

    <dialog class="confirm-dialog" id="ha500-dialog" aria-labelledby="ha500-dialog-title">
      <form id="ha500-form">
        <div class="dialog-mark" aria-hidden="true">硬</div>
        <h2 id="ha500-dialog-title">确认硬件型号</h2>
        <p>硬件控制仅适用于奥睿科 HA500。确认机型无误后，输入 <strong>HA500</strong> 启用。</p>
        <label class="dialog-field">
          <span>设备型号</span>
          <input id="ha500-confirmation" type="text" autocomplete="off" spellcheck="false" placeholder="HA500" />
        </label>
        <p class="dialog-error" id="ha500-error" hidden aria-live="polite"></p>
        <div class="dialog-actions">
          <button type="button" class="dialog-secondary" id="ha500-cancel">取消</button>
          <button type="submit" class="dialog-primary">确认启用</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
