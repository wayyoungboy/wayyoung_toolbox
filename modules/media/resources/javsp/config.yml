scanner:
  ignored_id_pattern:
    - '(144|240|360|480|720|1080)[Pp]'
    - '[24][Kk]'
    - '\w+2048\.com'
    - 'Carib(beancom)?'
    - '[^a-z\d](f?hd|lt)[^a-z\d]'
  input_directory: null
  filename_extensions: [.3gp, .avi, .f4v, .flv, .iso, .m2ts, .m4v, .mkv, .mov, .mp4, .mpeg, .mpg, .rm, .rmvb, .strm, .ts, .vob, .webm, .wmv]
  ignored_folder_name_pattern: ['^\.', '^#recycle$', '^#整理完成$', '^#不要扫描$']
  minimum_size: 1GiB
  skip_nfo_dir: false
  manual: false

network:
  proxy_server: null
  proxy_free:
    avsox: https://avsox.click
    javbus: https://www.javbus.com
    javdb: https://javdb.com
    javlib: https://www.c97k.com
  retry: 3
  timeout: PT10S

crawler:
  selection:
    normal: [faleno, airav, avsox, javbus, javdb, javlib, jav321, mgstage, prestige]
    fc2: [fc2, avsox, javdb, javmenu, fc2db, fc2ppvdb]
    cid: [fanza]
    getchu: [dl_getchu]
    gyutto: [gyutto]
  required_keys: [cover, title]
  movie_concurrency: 3
  hardworking: true
  respect_site_avid: true
  fc2fan_local_path: null
  sleep_after_scraping: PT1S
  use_javdb_cover: fallback
  normalize_actress_name: true

summarizer:
  move_files: true
  path:
    output_folder_pattern: '#整理完成/{actress}/[{num}] {title}'
    basename_pattern: '{num}'
    length_maximum: 250
    length_by_byte: true
    max_actress_count: 10
    hard_link: false
  title:
    remove_trailing_actor_name: true
  default:
    title: '#未知标题'
    actress: '#未知女优'
    series: '#未知系列'
    director: '#未知导演'
    producer: '#未知制作商'
    publisher: '#未知发行商'
  nfo:
    basename_pattern: '{num}'
    title_pattern: '{num} {title}'
    custom_genres_fields: ['{genre}', '{censor}']
    custom_tags_fields: ['{genre}', '{censor}']
  censor_options_representation: ['无码', '有码', '打码情况未知']
  cover:
    basename_pattern: poster
    highres: true
    add_label: false
    crop:
      on_id_pattern: ['^\d{6}[-_]\d{3}$', '^ARA', '^SIRO', '^GANA', '^MIUM', '^HHL']
      engine:
        name: pigo
  fanart:
    basename_pattern: fanart
  extra_fanarts:
    enabled: true
    scrap_interval: PT1.5S

translator:
  engine:
    name: google
  fields:
    title: true
    plot: true

other:
  interactive: false
  check_update: false
  auto_update: false
